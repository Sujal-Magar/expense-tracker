<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <linearGradient id="agent-a-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="agent-b-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#0f1124"/>
    </linearGradient>

    <linearGradient id="consensus-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>

    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>

    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>

    <filter id="shadow-card-2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg-grad-2)" rx="16"/>

  <!-- Header Section -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="1.2"/>
    <text x="85" y="17" fill="#c084fc" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">ALTERNATIVE PATTERN</text>
    <text x="0" y="56" fill="#f8fafc" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Peer-to-Peer Multi-Agent (Collaborative Debate)</text>
    <text x="0" y="82" fill="#94a3b8" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Independent agents communicating as equals — critiquing, refining, and negotiating consensus</text>
  </g>

  <!-- AGENT A: ARCHITECT (Left) -->
  <g transform="translate(60, 180)" filter="url(#shadow-card-2)">
    <rect x="-2" y="-2" width="384" height="344" rx="18" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
    <rect x="0" y="0" width="380" height="340" rx="16" fill="url(#agent-a-grad)" stroke="#334155" stroke-width="1"/>

    <rect x="24" y="24" width="130" height="24" rx="6" fill="#0284c7" opacity="0.25"/>
    <circle cx="36" cy="36" r="4" fill="#38bdf8"/>
    <text x="46" y="40" fill="#38bdf8" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">PEER AGENT A</text>

    <text x="24" y="80" fill="#f8fafc" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">System Architect</text>
    <text x="24" y="104" fill="#94a3b8" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Primary Focus: Feature delivery &amp; scalability</text>

    <line x1="24" y1="126" x2="356" y2="126" stroke="#334155" stroke-width="1"/>

    <text x="24" y="152" fill="#cbd5e1" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">ROLE ATTRIBUTES:</text>
    <g transform="translate(24, 172)">
      <circle cx="6" cy="6" r="3" fill="#38bdf8"/>
      <text x="18" y="10" fill="#94a3b8" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Proposes API schemas &amp; data models</text>
    </g>
    <g transform="translate(24, 198)">
      <circle cx="6" cy="6" r="3" fill="#38bdf8"/>
      <text x="18" y="10" fill="#94a3b8" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Designs optimal developer ergonomic flow</text>
    </g>
    <g transform="translate(24, 224)">
      <circle cx="6" cy="6" r="3" fill="#38bdf8"/>
      <text x="18" y="10" fill="#94a3b8" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Advocates for clean separation of concerns</text>
    </g>
    <g transform="translate(24, 250)">
      <circle cx="6" cy="6" r="3" fill="#38bdf8"/>
      <text x="18" y="10" fill="#94a3b8" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Iterates in response to security reviews</text>
    </g>

    <!-- Authority badge -->
    <rect x="24" y="288" width="170" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="109" y="304" fill="#38bdf8" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">EQUAL PEER AUTHORITY</text>
  </g>

  <!-- INTERACTION ZONE (Center Bridge) -->
  <g transform="translate(480, 210)">
    <!-- Background box for communication bus -->
    <rect x="0" y="0" width="240" height="280" rx="14" fill="#0b1322" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4"/>
    
    <text x="120" y="35" fill="#f8fafc" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PEER DEBATE BUS</text>
    <text x="120" y="55" fill="#64748b" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Multi-turn iteration</text>

    <!-- Arrow Right: Propose -->
    <path d="M 20 100 L 220 100" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <rect x="45" y="82" width="150" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="120" y="95" fill="#38bdf8" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">1. Propose Spec &amp; Schema</text>

    <!-- Arrow Left: Critique -->
    <path d="M 220 160 L 20 160" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
    <rect x="45" y="142" width="150" height="18" rx="4" fill="#0f172a" stroke="#c084fc" stroke-width="0.8"/>
    <text x="120" y="155" fill="#c084fc" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">2. Challenge &amp; Critique</text>

    <!-- Arrow Right: Revision -->
    <path d="M 20 220 L 220 220" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-green)"/>
    <rect x="45" y="202" width="150" height="18" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="0.8"/>
    <text x="120" y="215" fill="#34d399" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">3. Revised Compromise</text>
  </g>

  <!-- AGENT B: SECURITY REVIEWER (Right) -->
  <g transform="translate(760, 180)" filter="url(#shadow-card-2)">
    <rect x="-2" y="-2" width="384" height="344" rx="18" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.7"/>
    <rect x="0" y="0" width="380" height="340" rx="16" fill="url(#agent-b-grad)" stroke="#334155" stroke-width="1"/>

    <rect x="24" y="24" width="130" height="24" rx="6" fill="#7e22ce" opacity="0.25"/>
    <circle cx="36" cy="36" r="4" fill="#c084fc"/>
    <text x="46" y="40" fill="#c084fc" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">PEER AGENT B</text>

    <text x="24" y="80" fill="#f8fafc" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Security Reviewer</text>
    <text x="24" y="104" fill="#94a3b8" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Primary Focus: Risk mitigation &amp; compliance</text>

    <line x1="24" y1="126" x2="356" y2="126" stroke="#334155" stroke-width="1"/>

    <text x="24" y="152" fill="#cbd5e1" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">ROLE ATTRIBUTES:</text>
    <g transform="translate(24, 172)">
      <circle cx="6" cy="6" r="3" fill="#c084fc"/>
      <text x="18" y="10" fill="#94a3b8" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Audits JWT expiration &amp; refresh semantics</text>
    </g>
    <g transform="translate(24, 198)">
      <circle cx="6" cy="6" r="3" fill="#c084fc"/>
      <text x="18" y="10" fill="#94a3b8" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Checks password hashing &amp; OAuth edge cases</text>
    </g>
    <g transform="translate(24, 224)">
      <circle cx="6" cy="6" r="3" fill="#c084fc"/>
      <text x="18" y="10" fill="#94a3b8" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Blocks approval if critical vulnerabilities exist</text>
    </g>
    <g transform="translate(24, 250)">
      <circle cx="6" cy="6" r="3" fill="#c084fc"/>
      <text x="18" y="10" fill="#94a3b8" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Grants cryptographic sign-off once aligned</text>
    </g>

    <rect x="24" y="288" width="170" height="24" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="0.8"/>
    <text x="109" y="304" fill="#c084fc" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">EQUAL PEER AUTHORITY</text>
  </g>

  <!-- CONSENSUS OUTPUT (Bottom) -->
  <g transform="translate(300, 580)">
    <!-- Path from center down to consensus -->
    <path d="M 300 -40 L 300 0" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>

    <rect x="0" y="0" width="600" height="85" rx="14" fill="url(#consensus-grad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow-card-2)"/>
    <circle cx="45" cy="42" r="18" fill="#10b981" opacity="0.3"/>
    <path d="M 37 42 L 42 47 L 53 36" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>

    <text x="80" y="34" fill="#f8fafc" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">Mutual Consensus: Hardened Architecture Specification</text>
    <text x="80" y="56" fill="#a7f3d0" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Produced neither by decree nor subordination, but through joint agreement.</text>
    
    <rect x="470" y="28" width="110" height="28" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1"/>
    <text x="525" y="46" fill="#34d399" font-family="Noto Sans, Adwaita Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">MUTUAL PASS</text>
  </g>
</svg>